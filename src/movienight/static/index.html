<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1530">
  <meta name="movienight-version" content="__MOVIENIGHT_VERSION__">
  <title>MovieNight</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <header class="topbar">
    <a class="wordmark" href="#/tonight" aria-label="MovieNight, tonight's pick" data-i18n-aria-label="wordmark.aria">MovieNight</a>
    <a class="sync-pill" href="#/setup" hidden>
      <span class="sync-pill__dot" aria-hidden="true"></span>
      <span class="sync-pill__text" data-i18n="sync.pill">Syncing</span>
    </a>
    <nav class="tabs" aria-label="Main" data-i18n-aria-label="nav.aria">
      <a class="tab" data-view="tonight" href="#/tonight"><span class="tab__icon" data-icon="ticket"></span><span data-i18n="tab.tonight">Tonight</span></a>
      <a class="tab" data-view="browse" href="#/browse"><span class="tab__icon" data-icon="grid"></span><span data-i18n="tab.browse">Browse</span></a>
      <a class="tab" data-view="complete" href="#/complete"><span class="tab__icon" data-icon="trophy"></span><span data-i18n="tab.complete">Complete</span></a>
      <a class="tab" data-view="ask" href="#/ask" hidden><span class="tab__icon" data-icon="ask"></span><span data-i18n="tab.ask">Ask</span></a>
      <a class="tab" data-view="taste" href="#/taste"><span class="tab__icon" data-icon="taste"></span><span data-i18n="tab.taste">Taste</span></a>
      <a class="tab" data-view="setup" href="#/setup"><span class="tab__icon" data-icon="gear"></span><span data-i18n="tab.setup">Setup</span></a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <dialog id="detail" class="sheet" aria-labelledby="detail-title">
    <div class="sheet__body"></div>
    <div class="toasts" role="status" aria-live="polite"></div>
  </dialog>

  <div class="toasts" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
</body>
</html>
