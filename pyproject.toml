[project]
name = "movienight"
version = "0.1.0"
description = "Recommends which movie to watch tonight from your Plex libraries using your Letterboxd history"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.6",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
