name: Preview image

# Manual: builds an image of any branch or SHA for testing on the home server
# (scripts/deploy.sh <branch|PR>). Always dispatched on main (so it also works for branches cut
# before this file existed) and it checks out the `ref` input. Pushes only sha-<short> and
# branch-<name> tags: never latest or a version, and no git tag or GitHub release.
run-name: Preview ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch name or commit SHA to build
        required: true
        type: string

concurrency:
  group: preview-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: rev
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          branch=$(printf '%s' "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-120)
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/andreub/movienight
          tags: |
            type=raw,value=sha-${{ steps.rev.outputs.short }}
            type=raw,value=branch-${{ steps.rev.outputs.branch }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=sha-${{ steps.rev.outputs.short }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
